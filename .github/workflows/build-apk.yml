name: Build Signed Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with Fixed Java File Chooser
        run: |
          # 1. Download Android Command Line Tools
          mkdir -p android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d android-sdk/cmdline-tools
          mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest

          export ANDROID_HOME=$PWD/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          # Accept SDK licenses automatically
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

          # 2. Create Android Project Structure
          mkdir -p myapp/app/src/main/assets
          mkdir -p myapp/app/src/main/res/mipmap-xxxhdpi
          cp www/index.html myapp/app/src/main/assets/index.html

          # 3. Apply Custom Logo (Supports logo.jpeg, logo.jpg, or logo.png)
          if [ -f www/logo.jpeg ]; then
            echo "Found custom JPEG logo: logo.jpeg"
            cp www/logo.jpeg myapp/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          elif [ -f www/logo.jpg ]; then
            echo "Found custom JPEG logo: logo.jpg"
            cp www/logo.jpg myapp/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          elif [ -f www/logo.png ]; then
            echo "Found custom PNG logo: logo.png"
            cp www/logo.png myapp/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            echo "No custom logo found, using default styling."
          fi

          # AndroidManifest.xml (Without deprecated package attribute)
          cat << 'EOF' > myapp/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Sai Music"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name="com.saimusic.app.MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java with Fixed, Clean File Chooser
          mkdir -p myapp/app/src/main/java/com/saimusic/app
          cat << 'EOF' > myapp/app/src/main/java/com/saimusic/app/MainActivity.java
          package com.saimusic.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              private ValueCallback<Uri[]> uploadMessage;
              private final static int FILE_CHOOSER_RESULT = 1;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView w = new WebView(this);
                  WebSettings settings = w.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  w.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (uploadMessage != null) {
                              uploadMessage.onReceiveValue(null);
                          }
                          uploadMessage = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_RESULT);
                          } catch (Exception e) {
                              uploadMessage = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  w.loadUrl("file:///android_asset/index.html");
                  setContentView(w);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent intent) {
                  if (requestCode == FILE_CHOOSER_RESULT) {
                      if (uploadMessage == null) return;
                      Uri[] results = null;
                      if (resultCode == RESULT_OK && intent != null) {
                          if (intent.getData() != null) {
                              results = new Uri[]{intent.getData()};
                          }
                      }
                      uploadMessage.onReceiveValue(results);
                      uploadMessage = null;
                  }
              }
          }
          EOF

          # build.gradle configuration
          cat << 'EOF' > myapp/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.saimusic.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.saimusic.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat << 'EOF' > myapp/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > myapp/settings.gradle
          rootProject.name = "SaiMusic"
          include ':app'
          EOF

          echo "android.useAndroidX=true" > myapp/gradle.properties
          echo "sdk.dir=$PWD/android-sdk" > myapp/local.properties

          # 4. Compile and Build APK
          cd myapp
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O gradle-8.5.zip
          unzip -q gradle-8.5.zip
          export PATH=$PWD/gradle-8.5/bin:$PATH

          gradle init --type basic --automation gradle || true
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Sai-Music-Signed.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sai-Music-Signed-APK
          path: Sai-Music-Signed.apk
