name: Build Signed Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with Direct Android Command Line Tools
        run: |
          # 1. Download Android Command Line Tools
          mkdir -p android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d android-sdk/cmdline-tools
          mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest

          export ANDROID_HOME=$PWD/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          # Accept SDK licenses automatically
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          # Install build-tools and platforms
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

          # 2. Create Android Project Structure
          mkdir -p myapp/app/src/main/assets
          cp www/index.html myapp/app/src/main/assets/index.html

          # AndroidManifest.xml
          cat << 'EOF' > myapp/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.nocturne.sleepmusic">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Nocturne Music"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java
          mkdir -p myapp/app/src/main/java/com/nocturne/sleepmusic
          cat << 'EOF' > myapp/app/src/main/java/com/nocturne/sleepmusic/MainActivity.java
          package com.nocturne.sleepmusic;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebChromeClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView w = new WebView(this);
                  w.getSettings().setJavaScriptEnabled(true);
                  w.getSettings().setDomStorageEnabled(true);
                  w.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  w.setWebChromeClient(new WebChromeClient());
                  w.loadUrl("file:///android_asset/index.html");
                  setContentView(w);
              }
          }
          EOF

          # build.gradle
          cat << 'EOF' > myapp/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.nocturne.sleepmusic'
              compileSdk 34
              defaultConfig {
                  applicationId "com.nocturne.sleepmusic"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat << 'EOF' > myapp/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > myapp/settings.gradle
          rootProject.name = "Nocturne"
          include ':app'
          EOF

          echo "android.useAndroidX=true" > myapp/gradle.properties
          echo "sdk.dir=$PWD/android-sdk" > myapp/local.properties

          # 3. Build APK
          cd myapp
          chmod +x gradlew || gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Nocturne-Sleep-Music-Signed.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-Sleep-Music-Signed-APK
          path: Nocturne-Sleep-Music-Signed.apk
